name: Repository CI

on:
  push:
    branches: ["main", "production-readiness", "audit-fixes-*"]
  pull_request:
    branches: ["main", "production-readiness"]

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Dummy env values so the build can complete without real keys.
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-dummy-auth-secret-0123456789abcdef' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'dummy-key-for-build-only' }}
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"

      - name: Dependency audit (blocking)
        run: npm audit --audit-level=high
